name: Bug report
description: Report reproducible SiteRadian website, documentation, or product behavior.
title: "[Bug]: "
labels: [bug, needs-triage]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SiteRadian. Please share the smallest safe reproduction you can.

        **Never paste access tokens, API keys, passwords, private keys, cookies, database credentials, or other secrets.** Redact private site URLs, customer data, and personal information where necessary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong?
      placeholder: Describe the issue clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a numbered sequence using sanitized values.
      placeholder: |
        1. Go to …
        2. Choose …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain what you expected first, then what happened instead.
      placeholder: |
        Expected: …
        Actual: …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the SiteRadian version and WordPress version. Add the PHP version, protection mode, and browser version when relevant.
      placeholder: |
        SiteRadian: 1.0.0
        WordPress: 7.1
        PHP (if known): 8.3
        Protection mode (if relevant): Standard
        Browser (for UI issues): Chrome 140
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Affected integration
      options:
        - Not integration-specific
        - Codex in ChatGPT Desktop
        - Codex CLI
        - Claude Desktop
        - Claude Code
        - Antigravity CLI
        - Gemini CLI
        - Cursor
        - Continue for VS Code
        - GitHub Copilot in VS Code
        - OpenCode
        - Command Code
        - Muse Code
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized logs, error codes, and additional context
      description: Paste only the smallest relevant excerpt after removing secrets and private data. Add any other context that materially helps reproduce the issue.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I have removed credentials, tokens, customer data, personal information, and private details from this report.
          required: true
